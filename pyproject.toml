[project]
name = "fastapistarter"
version = "0.1.0"
description = "A small FastAPI starter with sample APIs"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic-settings>=2.6",
    "email-validator>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
